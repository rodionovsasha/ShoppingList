server:
  port: ${port:8000}

management:
  server:
    port: ${management.port:9000}
  endpoints:
    web:
      base-path: /admin

spring:
  output:
    ansi:
      enabled: ALWAYS

logging:
  file:
    name: shoppingList.log
  level:
    org:
      hibernate: ERROR
      springframework:
        web: DEBUG
